services:
  - type: web
    name: contexthub-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: 'pip install "uv" && uv sync --frozen --no-dev --no-install-project'
    startCommand: '/opt/render/project/src/backend/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: groq/compound-mini
      - key: LLM_MAX_TOKENS
        value: "600"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: CHROMA_HOST
        sync: false
      - key: CHROMA_PORT
        value: "8000"
      - key: CHROMA_SSL
        value: "true"
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      - key: CORS_ORIGINS
        sync: false