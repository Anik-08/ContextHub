services:
  - type: web
    name: contexthub-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: 'pip install "uv" && uv sync --frozen --no-dev --no-install-project'
    startCommand: 'uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: groq/compound-mini
      - key: LLM_MAX_TOKENS
        value: "600"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHROMA_HOST
        sync: false
      - key: CHROMA_PORT
        value: "8000"
      - key: CHROMA_SSL
        value: "false"
      - key: CHROMA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false